<header class="border-b border-rule">
  <div class="page flex flex-wrap items-center justify-between gap-x-6 gap-y-2 py-3">
    <a routerLink="/" aria-label="Aleksi Hakala, home" class="block py-1">
      <span class="signature h-10 w-[7.5rem] bg-ink!" aria-hidden="true"></span>
    </a>

    <div class="flex items-center gap-3 sm:gap-6">
      <nav aria-label="Main" class="flex gap-5 sm:gap-7 font-medium">
        <a routerLink="/" routerLinkActive ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Home</a>
        <a routerLink="/code" routerLinkActive ariaCurrentWhenActive="page" class="nav-link">Work</a>
        <a routerLink="/contact" routerLinkActive ariaCurrentWhenActive="page" class="nav-link">Contact</a>
      </nav>

      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        class="grid size-11 place-items-center rounded-lg text-ink transition-colors hover:bg-surface hover:text-brand"
      >
        @if (theme.theme() === 'dark') {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path>
          </svg>
        } @else {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"></path>
          </svg>
        }
      </button>
    </div>
  </div>
</header>
