<header class="relative border-b border-rule">
  <div class="page flex items-center justify-between gap-x-6 py-3">
    <a routerLink="/" aria-label="Aleksi Hakala, home" class="block py-1" (click)="closeMenu()">
      <span class="signature h-10 w-[7.5rem] bg-ink!" aria-hidden="true"></span>
    </a>

    <div class="flex items-center gap-1 md:gap-6">
      <nav aria-label="Main" class="flex gap-7 font-medium max-md:hidden">
        @for (link of links; track link.path) {
          <a [routerLink]="link.path" routerLinkActive ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: link.exact }" class="nav-link">{{ link.label }}</a>
        }
      </nav>

      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        class="grid size-11 place-items-center rounded-lg text-ink transition-colors hover:bg-surface hover:text-brand"
      >
        @if (theme.theme() === 'dark') {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path>
          </svg>
        } @else {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"></path>
          </svg>
        }
      </button>

      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        class="grid size-11 place-items-center rounded-lg text-ink transition-colors hover:bg-surface hover:text-brand md:hidden"
      >
        @if (menuOpen()) {
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        } @else {
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        }
      </button>
    </div>
  </div>

  <nav
    id="mobile-menu"
    aria-label="Main"
    [hidden]="!menuOpen()"
    class="absolute inset-x-0 top-full z-20 border-b border-rule bg-bg shadow-[0_12px_24px_rgba(0,0,0,0.25)] md:hidden"
  >
    <ul class="page flex flex-col py-2 text-center">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            (click)="closeMenu()"
            class="mobile-link"
          >{{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>
</header>
